name: Crypto Paper Trader (Cloud Manual Only)

# Deliberately no crypto hourly schedule: GitHub Actions is NOT a reliable
# once-per-minute execution platform. Run the minute engine on a single laptop
# or persistent host. Default-branch schedules must also be reviewed separately.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose validation or manually process one confirmed crypto minute"
        type: choice
        required: true
        default: validate_only
        options:
          - validate_only
          - minute_once

permissions:
  contents: write

concurrency:
  group: india-paper-trader-main
  cancel-in-progress: false

jobs:
  crypto-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      - name: Process one confirmed crypto minute (paper only)
        if: inputs.mode == 'minute_once'
        run: |
          if [ ! -f data/crypto_state.json ]; then
            echo "No cloud portfolio; refusing automatic bootstrap. Run a local minute portfolio instead."
            exit 1
          fi
          python -m paper_trader.crypto_minute

      - name: Validation only
        if: inputs.mode == 'validate_only'
        run: echo "Offline tests passed; no virtual portfolio modified."

      - name: Commit explicitly requested minute portfolio and chart
        if: success() && inputs.mode == 'minute_once'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/crypto_state.json data/crypto_trades.csv data/crypto_chart.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update manually requested crypto minute paper portfolio [skip ci]"
            git push
          fi
