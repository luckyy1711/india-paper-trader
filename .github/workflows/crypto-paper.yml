name: Crypto Paper Trader (Cloud)

on:
  schedule:
    # Hourly at :13 UTC. GitHub Actions may delay or skip scheduled runs.
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Start first virtual BTC position or process one hourly signal"
        type: choice
        required: true
        default: start_btc_now
        options:
          - start_btc_now
          - paper_once
          - validate_only

permissions:
  contents: write

# Shares the stock/research workflow lock to avoid competing Git commits.
concurrency:
  group: india-paper-trader-main
  cancel-in-progress: false

jobs:
  crypto-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      - name: Start first BTC virtual position
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'start_btc_now'
        run: python -m paper_trader.crypto_paper --start-now

      - name: Process next confirmed hourly candle
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper_once')
        run: python -m paper_trader.crypto_paper

      - name: Validation only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate_only'
        run: echo "Offline tests passed; no virtual portfolio modified."

      - name: Commit crypto paper portfolio and chart
        if: success() && (github.event_name == 'schedule' || inputs.mode != 'validate_only')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/crypto_state.json data/crypto_trades.csv data/crypto_chart.json
          if ! git diff --cached --quiet; then
            git commit -m "Update hourly crypto paper portfolio [skip ci]"
            git push
          fi
