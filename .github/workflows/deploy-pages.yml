name: Publish Paper Dashboards (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages must be enabled in repository Settings > Pages > Source: GitHub Actions.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public dashboard bundle (no Python source, no Git metadata)
        run: |
          mkdir -p site/dashboard site/data
          cp -R dashboard/. site/dashboard/
          for name in state.json trades.csv research.json simulation.json synthetic_simulation.json paper_chart.json crypto_chart.json; do
            if [ -f "data/$name" ]; then
              cp "data/$name" "site/data/$name"
            fi
          done
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=dashboard/"><a href="dashboard/">Open NEON dashboard</a>\n' > site/index.html
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
