name: Crypto Minute Safety Tests

on:
  push:
    branches:
      - feature/open-source-quant-models
    paths:
      - 'paper_trader/crypto_minute.py'
      - 'paper_trader/crypto_paper.py'
      - 'paper_trader/crypto_preview.py'
      - 'tests/test_crypto_*.py'
      - '.github/workflows/minute-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-crypto-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crypto-only offline tests (no market network or trading)
        run: python -m unittest discover -s tests -p 'test_crypto_*.py' -v
