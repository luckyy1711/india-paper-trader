name: India Paper Trader

on:
  schedule:
    # 17:15 Asia/Kolkata (11:45 UTC), Monday-Friday. Exchange holidays are
    # checked from the presence of today's benchmark candle; no candle means skip.
    - cron: "45 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run one simulated paper-trading session or validate without trading"
        required: true
        type: choice
        default: paper_once
        options:
          - paper_once
          - validate_only

permissions:
  contents: write

concurrency:
  group: india-paper-trader-main
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run one paper-trading session
        if: github.event_name == 'schedule' || inputs.mode == 'paper_once'
        run: python -m paper_trader.main
      - name: Skip portfolio changes in validate-only mode
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate_only'
        run: echo "Validation-only run requested; no market data download or portfolio changes were made."

      - name: Save virtual portfolio and run logs to the private repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/trades.csv data/runs.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading records"
            git push
          fi
