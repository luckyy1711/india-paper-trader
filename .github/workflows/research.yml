name: Paper Strategy Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: india-paper-trader-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run historical strategy comparison (research only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from paper_trader.market_data import download_market_data
          from paper_trader.research import build_research_report

          bars = download_market_data()
          report = build_research_report(bars)
          path = Path("data/research.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Save research report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper strategy research report"
            git push
          fi
