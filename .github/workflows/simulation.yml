name: Historical Market Simulator

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy to replay on historical market data"
        required: true
        type: choice
        default: trend_momentum_126
        options:
          - trend_momentum_126
          - medium_momentum_63
          - ma_crossover_50_200
          - relative_strength_12_1
          - dual_momentum_6_12
          - nifty_regime_momentum_126
          - lightgbm_relative_alpha
      initial_cash:
        description: "Starting virtual capital in INR (1 to 1,000,000,000)"
        required: true
        type: number
        default: 10000
      evaluation_sessions:
        description: "Recent historical evaluation window"
        required: true
        type: choice
        default: "756"
        options:
          - "252"
          - "504"
          - "756"
          - "1008"
      cost_multiplier:
        description: "Stress modeled costs and slippage"
        required: true
        type: choice
        default: "1.0"
        options:
          - "1.0"
          - "1.5"
          - "2.0"

permissions:
  contents: write

concurrency:
  group: india-paper-trader-main
  cancel-in-progress: false

jobs:
  historical-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Replay historical market and train/evaluate selected model
        run: >-
          python -m paper_trader.simulation
          --strategy "${{ inputs.strategy }}"
          --initial-cash "${{ inputs.initial_cash }}"
          --sessions "${{ inputs.evaluation_sessions }}"
          --cost-multiplier "${{ inputs.cost_multiplier }}"
      - name: Save simulation result for dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simulation.json
          if ! git diff --cached --quiet; then
            git commit -m "Save historical simulation result"
            git push
          fi
